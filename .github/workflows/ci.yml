# ============================================================
# CI · 持续集成
#
# 每次 push / 提 PR 时自动执行：静态检查 → 测试 → 覆盖率门禁。
# 任一环节不过，这次提交就是红的，问题在合入前就被拦住，
# 而不是等上线后才发现。
#
# 两个需要知道的点：
#
# 1) CI 环境【没有 .env】（它被 .gitignore 排除，也不该进仓库）。
#    测试不需要真实密钥，所以这里显式声明 APP_ENV=development，
#    让启动配置校验走"仅告警、不阻断"分支。
#    绝不要把真实 key 写进本文件 —— workflow 是公开可见的。
#
# 2) 首次运行会偏慢：requirements.txt 含 sentence-transformers / chromadb
#    等重依赖。之后有 pip 缓存会快很多。
#
# 两个 job（并行执行）：
#   - lint-and-test：ruff → pytest → 覆盖率门禁（约 2 分钟，快速反馈）
#   - docker-build ：真实构建镜像并断言镜像内容（约 10 分钟，见该 job 注释）
# ============================================================

name: CI

on:
  push:
  pull_request:

# 同一分支连续推送时，取消上一次还在跑的流水线，省时间也省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 静态检查 + 测试
    runs-on: ubuntu-latest
    # 防止某一步卡死时把额度烧到 GitHub 默认的 6 小时上限。
    # 实测正常一轮（含装依赖）约 2-4 分钟，给 20 分钟足够宽裕。
    timeout-minutes: 20

    env:
      APP_ENV: development

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 的 python:3.11-slim 保持一致，避免"本地能跑 CI 挂"
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装 CJK 字体
        # tests/conftest.py 需要渲染中文来生成测试 PDF。运行器默认不带 CJK 字体，
        # 不装的话这 6 个中文 PDF 测试会被 skip —— 而中文文档解析正是本项目的核心
        # 场景，在 CI 里跳过就形成了盲区，所以这里主动装上让它真正跑起来。
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖
        # 为什么要先单独装 CPU 版 torch：
        #   Linux 上 PyPI 的 torch 默认是 CUDA 构建（wheel 529MB），并会额外拉
        #   nvidia-cudnn / nccl / cusparselt / nvshmem 等 4 个 CUDA 包，
        #   合计 1.5~2GB+，实测会让这一步卡十几分钟（Windows 本地装得快是因为
        #   那些 nvidia 依赖带平台条件标记，Windows 下不装，所以本地发现不了）。
        #   CI 只跑单元测试、用不到 GPU，先装上 CPU 版即可提前满足依赖，
        #   后续 pip 不会再拉 CUDA 版。
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: ruff check .

      - name: 运行测试与覆盖率门禁
        # 覆盖率地板：Windows 本机实测 73%（本轮新增运维/计时的测试后从 60% 提升），
        # 设 70% 留出平台差异余量。
        # 门禁的作用不是"提高覆盖率"，而是防止已经拿到的覆盖率被悄悄改回去 ——
        # 每补一批测试就应把地板跟着抬一次，否则门禁形同虚设。
        run: |
          pytest tests/ -q \
            --cov=app --cov=config \
            --cov-report=term-missing \
            --cov-fail-under=70

  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    # Docker 镜像要装 torch / sentence-transformers / chromadb，比测试 job 慢得多。
    # 首次约 10 分钟；之后靠 gha 层缓存，只有 requirements 变化时才会重建那一层。
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        # 为什么要在 CI 里构建镜像（而不是只在本地 build 一次）：
        #   1) Dockerfile 的改动此前从未被真正验证过 —— 本机 Docker 不可用
        #      （需管理员权限；WSL 路线被本机安全策略禁用），所以"能不能构建成功"
        #      一直是个未验证的假设。
        #   2) 这次改动恰恰是 Dockerfile 里的依赖安装层（改用 CPU 版 torch），
        #      属于最容易出错的一层，必须有真实构建来兜住。
        #   3) 放 CI 之后每次 push 都会重跑 → 从"一次性验证"变成"长期回归护栏"，
        #      以后谁改了 Dockerfile 或 requirements，构建坏了立刻会红。
        #   用 gha 层缓存：Dockerfile 分层，依赖层没变时不必重装。
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: enterprise-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证镜像内容
        # 关键：不只验证"构建成功"，还要验证"构建出来的东西是对的"。
        # 断言 torch 是 +cpu 版 —— 这正是本次 Dockerfile 改动要达到的效果。
        # 若哪天有人把 CPU 版 torch 那行删了，这个断言会立刻失败，
        # 而不是等到某次 docker build 后才发现镜像莫名其妙大了 2GB。
        run: |
          docker run --rm enterprise-rag:ci python -c "
          import torch
          v = torch.__version__
          print('torch 版本:', v)
          assert '+cpu' in v, (
              '期望 CPU 版 torch，实际 %s。CUDA 版会白白多占 1.5~2GB，'
              '而本服务 EMBEDDING_DEVICE=cpu，根本用不到 GPU。' % v
          )
          print('镜像内 torch 为 CPU 版 —— Dockerfile 的依赖层改动生效')
          "
          # 顺带验证核心依赖在 final 阶段能真正导入成功：
          # 多阶段构建用的是 --prefix 安装 + COPY --from，路径没配好会在这里暴露。
          docker run --rm enterprise-rag:ci python -c "
          import fastapi, chromadb, sentence_transformers, jieba
          print('核心依赖导入 OK —— 多阶段 COPY 的路径正确')
          "
